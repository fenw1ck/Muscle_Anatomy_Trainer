<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscle Trainer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--card:#fffdf8;--ink:#25292c;--mute:#6f7478;--line:#d9d3c6;--acc:#2f5d50;--accink:#fff;--sil:#e7e0d2;--bad:#c4452f;--gold:#e0a100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181a;--card:#202325;--ink:#ece9e2;--mute:#9a9e9f;--line:#3a3f42;--acc:#7fb8a4;--accink:#10201b;--sil:#2b2f31;--bad:#ee7a63;--gold:#f0b429}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181a;--card:#202325;--ink:#ece9e2;--mute:#9a9e9f;--line:#3a3f42;--acc:#7fb8a4;--accink:#10201b;--sil:#2b2f31;--bad:#ee7a63;--gold:#f0b429}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 40px}h1{font:700 26px Georgia,serif;margin:4px 0}.sub{color:var(--mute);font-size:14px;margin:0 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input{font:600 14px system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px}button.on,button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
svg{width:100%;height:min(66vh,560px);display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;touch-action:pan-y;user-select:none}
.sil{fill:var(--sil)}.mu *{fill:var(--gc);fill-opacity:.82;stroke:var(--ink);stroke-opacity:.45;stroke-width:1;cursor:pointer}.mu:hover *{fill-opacity:1}
.mu.dim *{fill-opacity:.15;stroke-opacity:.15}.mu.sel *{stroke:var(--ink);stroke-opacity:1;stroke-width:3;fill-opacity:1}
.mu.q *{fill:var(--gold);fill-opacity:1;animation:pl 1s infinite}.mu.bad *{fill:var(--bad);fill-opacity:1;stroke-opacity:1;stroke-width:3}.mu.ans *{fill:#3aa66b;fill-opacity:1;stroke-opacity:1;stroke-width:3}
@keyframes pl{50%{fill-opacity:.45}}.lbl{font:700 15px system-ui;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;pointer-events:none}
.ch{display:block;width:100%;text-align:left;margin:5px 0}.k{color:var(--mute);font-size:14px}#fb{min-height:2.6em;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Muscle Trainer</h1>
<p class="sub">Drag the body to rotate it. Tap a muscle. 34 major muscles, drawn as a simplified schematic.</p>
<div class="row" id="modes"><button data-m="learn" class="on">Learn</button><button data-m="practice">Practice</button>
<span id="po" style="display:none" class="row"><select id="qt"><option value="mc">Multiple choice</option><option value="fill">Fill in the blank</option></select><select id="lv"><option value="b">Beginner</option><option value="e">Expert</option></select></span></div>
<svg id="s" viewBox="0 0 300 640" aria-label="Human muscle diagram"></svg>
<div class="row"><button id="front">Front</button><button id="back">Back</button><button id="spin">Spin</button><input type="range" id="rot" min="0" max="359" value="0" aria-label="Rotation" style="flex:1"></div>
<div class="row"><button id="gp">◀</button><select id="gs" aria-label="Muscle group"></select><button id="gn">▶</button><button id="zo">Zoom out</button></div>
<div class="card" id="info"><b>Tap a muscle to identify it.</b></div>
<div class="card" id="pq" style="display:none"></div>
</main>
<script>
const $=id=>document.getElementById(id),svg=$("s"),NS="http://www.w3.org/2000/svg";
const GR=["Head & Neck","Shoulder","Chest","Back","Abdomen","Upper arm","Forearm","Hip & Glutes","Thigh","Lower leg"],HUE=[200,30,350,260,50,140,170,310,20,90];
// id, name, group, views, shape ("e cx cy rx ry rot" or "p path"), action
const M=[
["trap","Trapezius",3,"b","p M150 82 Q192 94 226 112 L204 152 L174 202 L150 242Z","Lifts, lowers and retracts the shoulder blade"],
["lat","Latissimus dorsi",3,"b","p M158 196 L202 170 L216 180 L206 238 L162 266Z","Pulls the arm down and back"],
["glutmax","Gluteus maximus",7,"b","p M151 322 L206 324 Q214 352 190 376 L151 374Z","Extends the hip"],
["glutmed","Gluteus medius",7,"b","p M168 292 L206 296 L208 322 L170 320Z","Moves the leg out to the side"],
["erector","Erector spinae",3,"b","p M150 150 L162 150 L165 292 L150 294Z","Straightens the spine"],
["rhomb","Rhomboid major",3,"b","p M154 126 L171 132 L170 168 L154 163Z","Pulls the shoulder blades together"],
["infra","Infraspinatus",1,"b","p M172 132 L206 128 L202 162 L174 168Z","Rotates the arm outward"],
["teres","Teres major",1,"b","e 213 166 12 6 -20","Rotates the arm inward and pulls it back"],
["delt","Deltoid",1,"fb","e 234 130 17 27 -8","Lifts the arm away from the body"],
["pec","Pectoralis major",2,"f","p M152 116 Q188 112 222 126 Q216 166 190 184 Q166 186 152 170Z","Pulls the arm across the chest"],
["serr","Serratus anterior",2,"f","p M196 170 L214 162 L217 198 L200 204Z","Holds the shoulder blade against the ribs"],
["rect","Rectus abdominis",4,"f","p M153 192 L178 192 L177 292 L153 294Z","Bends the trunk forward"],
["obl","External oblique",4,"f","p M181 196 L206 196 Q213 240 201 286 L181 291Z","Twists and bends the trunk"],
["scm","Sternocleidomastoid",0,"f","p M168 70 L176 72 L160 108 L151 106Z","Turns and tilts the head"],
["mass","Masseter",0,"f","e 166 62 6 9 0","Closes the jaw to chew"],
["temp","Temporalis",0,"f","e 171 40 7 9 0","Closes the jaw"],
["bic","Biceps brachii",5,"f","e 243 176 11 38 3","Bends the elbow and turns the palm up"],
["tric","Triceps brachii",5,"b","e 244 180 12 40 3","Straightens the elbow"],
["brach","Brachioradialis",6,"f","e 259 250 6 26 4","Bends the elbow"],
["fcr","Flexor carpi radialis",6,"f","e 249 292 7 32 3","Bends the wrist"],
["extd","Extensor digitorum",6,"b","e 254 286 8 38 3","Straightens the fingers"],
["tfl","Tensor fasciae latae",7,"f","p M201 300 L214 306 L212 346 L202 346Z","Moves the leg out and steadies the hip"],
["add","Adductor longus",8,"f","p M153 330 L170 344 L169 420 L157 412Z","Pulls the thigh toward the middle"],
["sart","Sartorius",8,"f","p M200 312 L208 308 L172 442 L164 440Z","Crosses the legs and bends the hip and knee"],
["rf","Rectus femoris",8,"f","e 186 386 12 54 0","Straightens the knee and bends the hip"],
["vl","Vastus lateralis",8,"f","e 208 396 10 54 0","Straightens the knee"],
["vm","Vastus medialis",8,"f","e 170 444 10 30 0","Straightens the knee"],
["bf","Biceps femoris",8,"b","e 204 416 11 54 0","Bends the knee and extends the hip"],
["st","Semitendinosus",8,"b","e 186 412 9 50 0","Bends the knee and extends the hip"],
["sm","Semimembranosus",8,"b","e 168 414 9 48 0","Bends the knee and extends the hip"],
["ta","Tibialis anterior",9,"f","e 190 546 7 42 0","Lifts the foot upward"],
["fib","Fibularis longus",9,"f","e 205 538 6 38 0","Turns the sole outward"],
["gas","Gastrocnemius",9,"b","e 190 530 13 38 0","Points the foot down and bends the knee"],
["sol","Soleus",9,"b","e 190 580 10 28 0","Points the foot down"]];
const BY={};M.forEach(m=>BY[m[0]]=m);
function shape(sp){const t=sp.split(" ");return t[0]==="e"?`<ellipse cx="${t[1]}" cy="${t[2]}" rx="${t[3]}" ry="${t[4]}" transform="rotate(${t[5]} ${t[1]} ${t[2]})"/>`:`<path d="${sp.slice(2)}"/>`}
const MIR='transform="translate(300 0) scale(-1 1)"';
function viewSvg(v){const sil='<ellipse class="sil" cx="150" cy="46" rx="24" ry="32"/><rect class="sil" x="138" y="70" width="24" height="30"/><path class="sil" d="M150 84 L226 108 L214 300 L212 345 L150 350Z"/><path class="sil" d="M222 108 Q258 116 262 140 L272 250 L274 345 L256 368 L246 362 L242 250 L228 188Z"/><path class="sil" d="M150 332 L214 336 L212 470 L208 600 L218 624 L166 626 L172 480 L150 400Z"/>';
return `<g class="sil">${sil}<g ${MIR}>${sil}</g></g>`+M.filter(m=>m[3].includes(v)).map(m=>`<g class="mu" data-id="${m[0]}" style="--gc:hsl(${HUE[m[2]]} 55% 52%)">${shape(m[4])}<g ${MIR}>${shape(m[4])}</g></g>`).join("")}
svg.innerHTML=`<g id="body"><g id="fv">${viewSvg("f")}</g><g id="bv" style="display:none">${viewSvg("b")}</g></g><text id="lbl" class="lbl" x="150" y="632" text-anchor="middle"></text>`;
const LOC=m=>`${GR[m[2]]} group, ${m[3]==="b"?"back":"front"} view`;
let rot=0,mode="learn",sel=null,spin=0,spinT=null,vb=[0,0,300,640],q=null,score=[0,0],busy=false;
function setRot(r){rot=((r%360)+360)%360;$("rot").value=Math.round(rot);const sx=Math.max(Math.abs(Math.cos(rot*Math.PI/180)),.04),back=Math.cos(rot*Math.PI/180)<0;$("body").setAttribute("transform",`translate(150 0) scale(${sx} 1) translate(-150 0)`);$("fv").style.display=back?"none":"";$("bv").style.display=back?"":"none"}
function face(v){const t=v==="b"?180:0,s=((t-rot+540)%360)-180,n=12;let i=0;(function step(){i++;setRot(rot+s/n);if(i<n)requestAnimationFrame(step)})()}
$("rot").oninput=e=>setRot(+e.target.value);$("front").onclick=()=>face("f");$("back").onclick=()=>face("b");
$("spin").onclick=()=>{spin=!spin;$("spin").classList.toggle("on",spin);clearInterval(spinT);if(spin)spinT=setInterval(()=>setRot(rot+2),40)};
// drag to rotate, tap to select
let dr=null;svg.addEventListener("pointerdown",e=>{dr={x:e.clientX,r:rot,moved:false}});
svg.addEventListener("pointermove",e=>{if(!dr)return;const dx=e.clientX-dr.x;if(Math.abs(dx)>6)dr.moved=true;if(dr.moved)setRot(dr.r+dx*.9)});
svg.addEventListener("pointerup",e=>{const m=dr&&!dr.moved&&e.target.closest(".mu");dr=null;if(m)pick(m.dataset.id)});
function cls(id,c,on){document.querySelectorAll(`.mu[data-id="${id}"]`).forEach(g=>g.classList.toggle(c,on))}
function clearMarks(){document.querySelectorAll(".mu").forEach(g=>g.classList.remove("sel","q","bad","ans"));$("lbl").textContent=""}
function show(id,c,label){cls(id,c,true);$("lbl").textContent=label||""}
function pick(id){if(mode==="learn"){clearMarks();sel=id;const m=BY[id];show(id,"sel",m[1]);$("info").innerHTML=`<b>${m[1]}</b><br><span class="k">${GR[m[2]]} · ${m[3]==="b"?"back view":m[3]==="f"?"front view":"both views"}</span><p>${m[5]}.</p><button id="zg">Zoom to ${GR[m[2]]}</button>`;$("zg").onclick=()=>zoom(m[2])}}
// zoom
function tween(to){const from=vb.slice();let i=0;(function s(){i++;const t=i/16,k=t*t*(3-2*t);vb=from.map((v,j)=>v+(to[j]-v)*k);svg.setAttribute("viewBox",vb.join(" "));if(i<16)requestAnimationFrame(s)})()}
GR.forEach((g,i)=>$("gs").insertAdjacentHTML("beforeend",`<option value="${i}">${g}</option>`));
function zoom(g){$("gs").value=g;const ms=M.filter(m=>m[2]===g),v=ms.filter(m=>m[3].includes("b")).length>ms.length/2?"b":"f";face(v);document.querySelectorAll(".mu").forEach(e=>e.classList.toggle("dim",BY[e.dataset.id][2]!==g));
setTimeout(()=>{const els=[...document.querySelectorAll(`#${v==="b"?"bv":"fv"} .mu`)].filter(e=>BY[e.dataset.id][2]===g);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;els.forEach(e=>{const b=e.getBBox();x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)});
x0=Math.min(x0,300-x1);x1=300-x0;const w=Math.max(x1-x0+40,120),h=Math.max(y1-y0+40,120),k=Math.max(w/svg.clientWidth,h/svg.clientHeight),W=k*svg.clientWidth,H=k*svg.clientHeight;tween([150-W/2,(y0+y1)/2-H/2,W,H])},260)}
function out(){document.querySelectorAll(".mu").forEach(e=>e.classList.remove("dim"));tween([0,0,300,640])}
$("zo").onclick=out;$("gs").onchange=e=>zoom(+e.target.value);$("gp").onclick=()=>zoom((+$("gs").value+GR.length-1)%GR.length);$("gn").onclick=()=>zoom((+$("gs").value+1)%GR.length);
// quiz
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
const norm=s=>s.toLowerCase().replace(/muscle|\bthe\b|[^a-z]/g,"");
function distract(m,ex){const o=M.filter(x=>x[0]!==m[0]),L=x=>lev(norm(x[1]),norm(m[1]));
if(ex){const same=shuf(o.filter(x=>x[2]===m[2])).slice(0,2),rest=o.filter(x=>!same.includes(x)).sort((a,b)=>L(a)-L(b));return[...same,...rest].slice(0,3)}
return shuf(o.filter(x=>x[2]!==m[2]&&x[1][0]!==m[1][0]).sort((a,b)=>L(b)-L(a)).slice(0,8)).slice(0,3)}
function ask(){busy=false;clearMarks();const pool=M.filter(m=>!q||m[0]!==q[0]);q=pool[Math.floor(Math.random()*pool.length)];face(q[3]==="b"?"b":"f");show(q[0],"q");
const mc=$("qt").value==="mc";let h=`<b>Which muscle is flashing?</b> <span class="k">Score ${score[0]}/${score[1]}</span><div id="fb"></div>`;
if(mc)h+=shuf([q,...distract(q,$("lv").value==="e")]).map(m=>`<button class="ch" data-a="${m[0]}">${m[1]}</button>`).join("");else h+=`<div class="row"><input id="ft" placeholder="Type the muscle name" autocomplete="off" style="flex:1"><button class="p" id="fg">Check</button></div>`;
$("pq").innerHTML=h;if(!mc){$("fg").onclick=()=>answer(find($("ft").value));$("ft").onkeydown=e=>{if(e.key==="Enter")answer(find($("ft").value))}}}
function find(t){const n=norm(t);if(!n)return null;const pre=M.filter(m=>norm(m[1]).startsWith(n));if(n.length>=5&&pre.length===1)return pre[0];let b=null,bd=9;for(const m of M){const d=lev(n,norm(m[1])),lim=norm(m[1]).length>=7?2:0;if(d<=lim&&d<bd){bd=d;b=m}}return b}
function answer(m){if(busy)return;busy=true;score[1]++;const fb=$("fb");
if(m&&m[0]===q[0]){score[0]++;clearMarks();show(q[0],"ans",q[1]);fb.innerHTML=`<b>Correct!</b> ${q[1]}: ${q[5]}. <button class="p" id="nx">Next</button>`;$("nx").onclick=ask;return}
clearMarks();const rv=()=>{face(q[3]==="b"?"b":"f");clearMarks();show(q[0],"ans",q[1]);fb.innerHTML=`<b>The answer is ${q[1]}.</b> It is in the ${LOC(q)}. ${q[5]}. <button class="p" id="nx">Next</button>`;$("nx").onclick=ask};
if(m){face(m[3]==="b"?"b":"f");show(m[0],"bad",m[1]);fb.innerHTML=`Not quite. You picked <b>${m[1]}</b> (${LOC(m)}).`;setTimeout(rv,2600)}else{fb.textContent="I don’t recognise that name.";setTimeout(rv,1500)}}
$("pq").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b)answer(BY[b.dataset.a])});
function setMode(m){mode=m;document.querySelectorAll("#modes>button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));$("po").style.display=m==="practice"?"inline-flex":"none";$("pq").style.display=m==="practice"?"":"none";$("info").style.display=m==="learn"?"":"none";clearMarks();if(m==="practice"){score=[0,0];q=null;ask()}}
$("modes").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)setMode(b.dataset.m)});$("qt").onchange=$("lv").onchange=()=>{$("lv").style.display=$("qt").value==="mc"?"":"none";if(mode==="practice")ask()};
setRot(0);
</script>
</body>
</html>
